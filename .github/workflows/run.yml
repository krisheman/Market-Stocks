name: Market Scanner Every Minute

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub minimum schedule
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install yfinance textblob pandas requests

      - name: Run job every minute for 5 minutes
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          for i in {1..5}; do
            echo "Running at $(date)"
            python market_scanner.py
            sleep 60
          done
