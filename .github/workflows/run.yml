name: Market Scanner Every Minute

on:
  push:                   # Added this so it runs when you save the file
  schedule:
    - cron: "*/5 * * * *" # Runs every 5 minutes
  workflow_dispatch:      # Allows manual button click

jobs:
  run-scanner:            # Renamed job from 'run' to 'run-scanner' to avoid confusion
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install yfinance textblob pandas requests

      - name: Run job every minute for 5 minutes
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Run the loop 5 times (0 to 4)
          for i in {0..4}; do
            echo "Loop run: $i - Running at $(date)"
            
            # Run your script
            python market_scanner.py
            
            # Only sleep if this is not the last run (to save seconds)
            if [ "$i" -lt 4 ]; then
              echo "Sleeping for 60 seconds..."
              sleep 60
            fi
          done
